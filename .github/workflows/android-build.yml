name: Build SUMIT BOSS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Synchronize Capacitor Android Project
        run: npx cap sync android

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode all

      - name: Inspect & Rename Output APKs
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} output-apk/SUMIT-BOSS-debug.apk \;
          echo "=== Generated APK Files ==="
          ls -lh output-apk/

      - name: Verify APK Exists
        run: |
          if [ ! -f "output-apk/SUMIT-BOSS-debug.apk" ]; then
            echo "::error::No APK was generated in output directory!"
            exit 1
          fi
          echo "APK successfully verified and ready for download."

      - name: Upload SUMIT-BOSS-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUMIT-BOSS-APK
          path: output-apk/SUMIT-BOSS-debug.apk
          retention-days: 30
          if-no-files-found: error
