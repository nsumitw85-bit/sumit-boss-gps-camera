name: Build SUMIT BOSS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Run Type Check & Verification
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Synchronize Capacitor Android Project
        run: npx cap sync android

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Setup Optional Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Clean Android Project
        working-directory: android
        run: ./gradlew clean

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK (if requested)
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Inspect & Rename Output APKs
        run: |
          mkdir -p output-apk
          if [ -d "android/app/build/outputs/apk/release" ]; then
            find android/app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} output-apk/SUMIT-BOSS-release.apk \;
          fi
          if [ -d "android/app/build/outputs/apk/debug" ]; then
            find android/app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} output-apk/SUMIT-BOSS-debug.apk \;
          fi
          echo "=== Generated APK Files ==="
          ls -lh output-apk/

      - name: Verify APK Exists
        run: |
          if [ ! -f "output-apk/SUMIT-BOSS-release.apk" ] && [ ! -f "output-apk/SUMIT-BOSS-debug.apk" ]; then
            echo "::error::No APK was generated in output directory!"
            exit 1
          fi
          echo "APK successfully verified and ready for download."

      - name: Upload SUMIT-BOSS-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUMIT-BOSS-APK
          path: output-apk/*.apk
          retention-days: 30
          if-no-files-found: error
