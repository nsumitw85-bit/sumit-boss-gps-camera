name: Build Sumit Boss Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: sumit-boss-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Synchronize Capacitor Android Assets
        run: npx cap sync android

      - name: Ensure Gradle Wrapper Executable & Wrapper Jar
        run: |
          cd android
          chmod +x gradlew
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found or empty, downloading..."
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify & Prepare APK Artifact
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -s "$RAW_APK" ]; then
            echo "::error::Generated APK not found or is empty!"
            exit 1
          fi

          FINAL_APK="android/app/build/outputs/apk/debug/SumitBoss-GPS-Map-Camera.apk"
          cp "$RAW_APK" "$FINAL_APK"
          APK_SIZE=$(du -h "$FINAL_APK" | cut -f1)

          echo "Found valid APK at: $FINAL_APK"
          echo "APK Size: $APK_SIZE"
          echo "APK_FILE=$FINAL_APK" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

          echo "### 🚀 SUMIT BOSS Android APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | SUMIT BOSS GPS MAP CAMERA |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`com.sumitboss.gpscamera\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK File** | \`SumitBoss-GPS-Map-Camera.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Target** | Debug APK (Installable) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section at the bottom of this run summary." >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumit-boss-gps-map-camera-apk
          path: ${{ env.APK_FILE }}
          retention-days: 14
